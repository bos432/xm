name: Modernization Quality Gate

on:
  pull_request:
    paths:
      - 'modernization/**'
      - '.github/workflows/modernization-quality.yml'
  push:
    branches: ['**']
    paths:
      - 'modernization/**'
      - '.github/workflows/modernization-quality.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernization/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, zip, xml, gd
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: modernization/backend
      - name: Validate Composer manifests
        run: composer validate --no-check-publish
      - name: Audit PHP dependencies
        run: composer audit
      - name: Run backend feature tests
        run: vendor/bin/phpunit --no-coverage
      - name: Dry-run migrations
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan migrate --pretend --force
      - name: Validate API route registration
        run: php artisan route:list --except-vendor --json > /tmp/modernization-routes.json

  mysql57-migrations:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: isolated-ci-root-password
          MYSQL_DATABASE: modernization_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pisolated-ci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: modernization/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, zip, xml, gd
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          working-directory: modernization/backend
      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
      - name: Apply the exact production MySQL compatibility transforms
        run: |
          sed -i "s/->json(/->longText(/g" database/migrations/2026_06_06_000001_create_modernization_core_tables.php
          sed -i "s/string('key')->primary()/string('key', 191)->primary()/g" database/migrations/2026_06_06_000002_create_runtime_support_tables.php
          sed -i "s/string('owner')/string('owner', 191)/g" database/migrations/2026_06_06_000002_create_runtime_support_tables.php
          sed -i "s/string('id')->primary()/string('id', 191)->primary()/g" database/migrations/2026_06_06_000002_create_runtime_support_tables.php
          sed -i "s/string('queue')->index()/string('queue', 191)->index()/g" database/migrations/2026_06_06_000002_create_runtime_support_tables.php
          sed -i "s/string('name')/string('name', 191)/g" database/migrations/2026_06_06_000002_create_runtime_support_tables.php
          sed -i "s/string('uuid')->unique()/string('uuid', 191)->unique()/g" database/migrations/2026_06_06_000002_create_runtime_support_tables.php
      - name: Run all migrations against isolated MySQL 5.7
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: modernization_migration_test
          DB_USERNAME: root
          DB_PASSWORD: isolated-ci-root-password
        run: |
          php artisan migrate --force --no-interaction
          php artisan migrate:status
          count="$(php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo Illuminate\Support\Facades\DB::table("migrations")->count();')"
          test "$count" -ge 11

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modernization/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modernization/frontend/package-lock.json
      - run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  deployment-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment shell syntax
        run: bash -n modernization/deploy/deploy.sh modernization/deploy/site-backup.sh modernization/deploy/tests/site-backup-test.sh modernization/deploy/tests/deploy-release-safety-test.sh modernization/deploy/tests/deploy-rollback-test.sh modernization/deploy/tests/mock-command.sh
      - name: Verify backup and OSS failure handling
        run: bash modernization/deploy/tests/site-backup-test.sh
      - name: Verify deployment backup, switch, and rollback safety
        run: bash modernization/deploy/tests/deploy-release-safety-test.sh
      - name: Verify release isolation and rollback
        run: bash modernization/deploy/tests/deploy-rollback-test.sh
